<style>
/* ==========================================================================
   Vends-moi ça — version web (mono-fichier)
   Servie par le projet Next.js/Vercel : l'API est sur la même origine (/api).
   ========================================================================== */
:root {
  --bg: #F4F1E8; --ink: #171712; --ink2: #25231E; --ink3: #34312B;
  --muted: #77736A; --muted2: #8B877E; --line: #DED9CD; --line2: #E5E0D5;
  --card: #FFFFFF; --soft: #ECE7DC; --soft2: #E9E4D9;
  --gold: #807047; --gold2: #E6D486; --green: #1D4D32; --green2: #31523A;
  --greenbg: #E5EFE3; --warnbg: #FFF3DA; --warn: #785B1C; --red: #9B5A50; --redbg: #F7E4E0;
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; }

/* En-tête + onglets ------------------------------------------------------- */
header { position: sticky; top: 0; z-index: 10; background: var(--bg); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px 10px; }
.logo { font-size: 24px; font-weight: 900; letter-spacing: -.8px; }
.tag { font-size: 11px; color: var(--muted); margin-top: 1px; }
.badge { background: var(--ink); color: #fff; border-radius: 12px; padding: 5px 10px; font-weight: 900; font-size: 12px; }
nav { display: flex; border-bottom: 1px solid var(--line); }
nav button { flex: 1; padding: 7px 0 9px; position: relative; color: #9A968C; }
nav .ico { display: block; font-size: 17px; height: 21px; }
nav .lbl { display: block; font-size: 10px; font-weight: 800; }
nav button.on { color: var(--ink); }
nav button.on::after { content: ""; position: absolute; bottom: -1px; left: 50%; width: 24px; margin-left: -12px; height: 3px; border-radius: 3px; background: var(--ink); }

main { padding: 17px 16px calc(90px + var(--safe-b)); }

/* Typographie ------------------------------------------------------------- */
.kicker { font-size: 10px; font-weight: 900; letter-spacing: 1.5px; color: var(--gold); }
.h1 { font-size: 27px; font-weight: 900; line-height: 1.15; letter-spacing: -.8px; margin: 4px 0 6px; }
.h2 { font-size: 18px; font-weight: 900; letter-spacing: -.3px; margin: 0 0 10px; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 11px; color: var(--muted2); line-height: 1.45; }
.label { font-size: 11px; font-weight: 900; color: #4D493F; margin: 14px 0 6px; display: block; }
.section { font-size: 11px; font-weight: 900; color: #4D493F; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .8px; }
.bold { font-weight: 900; color: var(--ink2); }

/* Composants -------------------------------------------------------------- */
.card { background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius); padding: 15px; }
.hero { background: #1E211B; color: #fff; border-radius: 26px; padding: 22px; margin-bottom: 22px; }
.hero .kicker { color: #D9C98D; }
.hero h2 { font-size: 28px; line-height: 1.12; font-weight: 900; letter-spacing: -.9px; margin: 8px 0 0; }
.hero p { color: #C9C9C0; font-size: 13px; margin: 10px 0 0; }
.btn { display: block; width: 100%; text-align: center; border-radius: 16px; padding: 15px; font-weight: 900; font-size: 14px; background: var(--ink); color: #fff; }
.btn.gold { background: var(--gold2); color: var(--ink); margin-top: 18px; }
.btn:disabled { opacity: .55; }
.btn2 { flex: 1; text-align: center; border: 1px solid #D3CEC2; background: #fff; border-radius: 13px; padding: 12px 10px; font-weight: 900; font-size: 12px; color: #3B3933; }
.btn2:disabled { opacity: .55; }
.row { display: flex; gap: 9px; margin-top: 10px; }
.link { font-weight: 800; font-size: 12px; color: #75663C; text-align: center; display: block; width: 100%; padding: 13px; }
.link.red { color: var(--red); font-size: 11px; padding: 12px 0 0; }
.input, .textarea { width: 100%; border: 1px solid #D5D0C5; background: #fff; border-radius: 13px; padding: 12px 13px; font-size: 16px; outline: none; }
.input:focus, .textarea:focus { border-color: #9C9277; }
.textarea { min-height: 105px; resize: vertical; }
.textarea.tall { min-height: 170px; background: #FAF9F5; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { padding: 7px 11px; background: var(--soft2); border-radius: 999px; font-size: 11px; font-weight: 800; color: #4A473F; }
.chip.on { background: var(--ink); color: #fff; }
.chip .ok { color: #7FB27A; margin-left: 4px; }
.seg { display: flex; gap: 7px; }
.seg button { flex: 1; border-radius: 12px; padding: 11px 0; background: #E8E3D8; font-size: 11px; font-weight: 900; color: #69655C; }
.seg button.on { background: var(--ink); color: #fff; }

/* Tableau de bord --------------------------------------------------------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric .l { font-size: 11px; color: var(--muted); font-weight: 800; }
.metric .v { font-size: 24px; font-weight: 900; color: var(--green); margin-top: 4px; }
.metric .s { font-size: 10px; color: #89857B; margin-top: 3px; }
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 9px 0 23px; }
.mini { background: var(--soft); border-radius: 13px; padding: 9px 0; text-align: center; }
.mini b { display: block; font-size: 17px; font-weight: 900; }
.mini span { font-size: 10px; color: var(--muted); }
.between { display: flex; justify-content: space-between; align-items: center; }
.compact { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line2); border-radius: 16px; padding: 10px; margin-bottom: 8px; width: 100%; text-align: left; }
.thumb { width: 55px; height: 55px; border-radius: 11px; background: var(--soft); object-fit: cover; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.thumb.big { width: 88px; height: 88px; border-radius: 13px; font-size: 28px; }
.compact .t { font-size: 12px; font-weight: 900; color: #292721; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.compact .p { font-size: 14px; font-weight: 900; color: #2D5038; }
.arrow { font-size: 27px; color: #9A968C; }

/* Photos ------------------------------------------------------------------ */
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slot { position: relative; height: 155px; border-radius: var(--radius); border: 1.5px dashed #BEB7A7; background: #EBE6DB; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; text-align: center; }
.slot.req { border-color: #84723D; background: #F0E8CB; }
.slot .i { font-size: 29px; margin-bottom: 7px; }
.slot .t { font-weight: 900; font-size: 13px; color: var(--ink3); }
.slot .s { font-size: 10px; color: #7D786E; margin-top: 4px; line-height: 1.35; }
.slot .plus { margin-top: 8px; width: 26px; height: 26px; border-radius: 13px; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.slot.filled { border: 0; padding: 0; overflow: hidden; }
.slot.filled img { width: 100%; height: 100%; object-fit: cover; }
.slot .cap { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.62); color: #fff; font-size: 11px; font-weight: 900; padding: 8px; text-align: left; }
.slot .rm { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 14px; background: rgba(0,0,0,.72); color: #fff; font-size: 19px; line-height: 28px; }
.tip { background: #E8EDE4; border-radius: 15px; padding: 13px; margin: 12px 0 8px; }
.tip b { font-size: 12px; color: #334235; }
.tip p { font-size: 11px; color: #5F6A60; margin: 4px 0 0; }
.step { display: flex; align-items: center; gap: 9px; margin: 22px 0 12px; }
.step .n { width: 27px; height: 27px; border-radius: 14px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }
.step .x { font-size: 18px; font-weight: 900; color: var(--ink2); }
.state { display: block; width: 100%; text-align: left; background: var(--soft); border-radius: 14px; padding: 12px; margin: 16px 0; }
.state b { font-size: 12px; color: var(--ink3); }
.state span { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }

/* Progression + résultat -------------------------------------------------- */
.progress .r { display: flex; gap: 9px; padding: 5px 0; font-size: 12px; color: #A09B91; }
.progress .r.on { color: var(--ink3); font-weight: 700; }
.progress .r .d { width: 18px; font-weight: 900; color: #C9C3B5; }
.progress .r.on .d { color: #587353; }
.result { margin-top: 18px; border-radius: 22px; padding: 16px; }
.rhead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.rtitle { font-size: 22px; font-weight: 900; letter-spacing: -.5px; margin: 4px 0 2px; line-height: 1.15; }
.bubble { flex: none; width: 54px; height: 54px; border-radius: 27px; background: #E7EFE4; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.bubble b { font-size: 14px; color: var(--green2); }
.bubble span { font-size: 8px; font-weight: 800; color: #68806E; }
.warn { background: var(--warnbg); border-radius: 13px; padding: 12px; margin-top: 14px; font-size: 11px; color: #7B672E; }
.warn b { color: var(--warn); display: block; margin-bottom: 3px; }
.prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.price { min-height: 82px; border-radius: 13px; background: #F1EEE6; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.price.hot { background: #E6EFE3; }
.price.on { border-color: #284C33; }
.price .l { font-size: 9px; font-weight: 800; color: var(--muted); }
.price .v { font-size: 19px; font-weight: 900; margin-top: 2px; }
.price .c { font-size: 8px; font-weight: 900; color: var(--green2); min-height: 11px; }
.meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; margin-top: 9px; font-size: 10px; color: var(--muted); }
.pill { background: var(--soft); border-radius: 999px; padding: 5px 10px; font-size: 10px; font-weight: 900; color: #514C40; }
.body { font-size: 13px; color: #39372F; }
.comp { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid #EEEAE1; }
.comp .t { font-size: 12px; font-weight: 800; color: var(--ink3); }
.comp .m { font-size: 10px; color: #89857B; }
.comp .p { font-size: 15px; font-weight: 900; color: #244C32; margin-left: auto; white-space: nowrap; }
.bullets { margin: 0; padding: 0; list-style: none; font-size: 12px; color: #45423A; }
.bullets li { margin-bottom: 3px; }
.tips { background: #F2F4EC; border-radius: 13px; padding: 11px; }
.plat { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEEAE1; text-decoration: none; }
.plat .sc { width: 36px; height: 36px; border-radius: 18px; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; flex: none; }
.plat .n { font-size: 12px; font-weight: 900; }
.plat .r { font-size: 10px; color: #817D73; }
.plat .go { margin-left: auto; font-size: 10px; font-weight: 900; color: #665622; white-space: nowrap; }
.ship { background: #EDF0E9; border-radius: 13px; padding: 12px; margin-top: 16px; }
.ship b { font-size: 11px; color: #405342; }
.src { display: block; font-size: 11px; color: #425B80; font-weight: 700; padding: 5px 0; text-decoration: none; word-break: break-word; }
.priceedit { position: relative; width: 150px; }
.priceedit .input { font-size: 18px; font-weight: 900; padding-right: 30px; }
.priceedit span { position: absolute; right: 13px; top: 12px; font-weight: 900; color: #6D695F; font-size: 16px; }

/* Ventes ------------------------------------------------------------------ */
.filters { display: flex; gap: 7px; overflow-x: auto; padding: 13px 0; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters .chip { white-space: nowrap; padding: 8px 12px; }
.sale { margin-top: 11px; padding: 12px; }
.sale .top2 { display: flex; gap: 12px; }
.sale .t { font-size: 14px; font-weight: 900; line-height: 1.25; }
.sale .p { font-size: 20px; font-weight: 900; color: #275038; margin-top: 3px; }
.sale .m { font-size: 10px; color: #8B877D; }
.status { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 8px; font-weight: 900; color: #4B4840; background: #E8E3D8; margin-bottom: 4px; letter-spacing: .4px; }
.status.listed { background: #E3EBF2; }
.status.sold { background: #DDEDDD; }
.empty { text-align: center; padding: 30px; margin-top: 20px; }
.empty .e { font-size: 42px; }

/* Réglages ---------------------------------------------------------------- */
.keyrow { display: flex; gap: 8px; }
.keyrow .input { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
.eye { width: 47px; border-radius: 13px; background: var(--soft2); font-size: 17px; }
.switch { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
.switch .txt { flex: 1; }
.switch .txt b { font-size: 13px; color: var(--ink2); }
.toggle { position: relative; width: 50px; height: 30px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle i { position: absolute; inset: 0; border-radius: 15px; background: #C9C3B5; transition: .2s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle input:checked + i { background: #587353; }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:disabled + i { opacity: .45; }
.msg { border-radius: 14px; padding: 12px 13px; margin-top: 14px; font-size: 12px; font-weight: 700; }
.msg.ok { background: var(--greenbg); color: #2E4A34; }
.msg.ko { background: var(--redbg); color: #7E4238; }
.msg.info { background: var(--soft); color: var(--ink3); }
.note { background: var(--soft); border-radius: 15px; padding: 14px; margin-top: 22px; }
.note b { font-size: 12px; }
.note p { font-size: 11px; color: #6F6B62; margin: 5px 0 0; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #77736A 50%), linear-gradient(135deg, #77736A 50%, transparent 50%); background-position: calc(100% - 18px) 21px, calc(100% - 13px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }

/* Fenêtre modale + notification ------------------------------------------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(23,23,18,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding-bottom: calc(40px + var(--safe-b)); }
.sheet .bar { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 15px 16px; border-bottom: 1px solid var(--line); }
.sheet .bar b { font-size: 15px; }
.sheet .bar button { font-size: 12px; font-weight: 700; color: var(--muted); }
.sheet .bar button.save { color: #31563B; font-weight: 900; }
.sheet .in { padding: 16px; }
.soldbox { background: var(--greenbg); border-radius: 16px; padding: 15px; margin-top: 18px; }
.soldbox .v { font-size: 28px; font-weight: 900; color: #24482E; }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 13px; font-size: 13px; font-weight: 700; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -3px; }
.btn2 .spin { border-color: rgba(0,0,0,.15); border-top-color: #3B3933; }
@keyframes sp { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
.bprices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.bprice { border-radius: 13px; padding: 11px 6px; text-align: center; }
.bprice .l { font-size: 9px; font-weight: 800; }
.bprice .v { font-size: 19px; font-weight: 900; margin-top: 3px; }
.bprice.good { background: #DDEDDD; color: #24482E; }
.bprice.avg { background: #F1EEE6; color: #34312B; }
.bprice.bad { background: #F7E4E0; color: #7E4238; }
.gauge { position: relative; height: 12px; border-radius: 6px; margin: 26px 0 8px; background: linear-gradient(90deg, #9CC49A 0%, #9CC49A var(--g), #E8D9A8 var(--g), #E8D9A8 var(--b), #E3A698 var(--b), #E3A698 100%); }
.gauge .mk { position: absolute; top: -22px; transform: translateX(-50%); font-size: 10px; font-weight: 900; color: var(--ink); white-space: nowrap; }
.gauge .mk::after { content: ""; position: absolute; left: 50%; top: 15px; width: 2px; height: 19px; margin-left: -1px; background: var(--ink); }
.verdict { font-size: 12px; margin-top: 10px; }
.verdict b { font-weight: 900; }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #EEEAE1; cursor: pointer; }
.checks input { margin-top: 2px; width: 18px; height: 18px; accent-color: #3E6B46; flex: none; }
.checks b { font-size: 12px; color: var(--ink2); display: block; }
.checks span { font-size: 11px; color: var(--muted); }
.checks input:checked + div b { text-decoration: line-through; color: var(--muted); }
.flags { background: #F7E4E0; border-radius: 13px; padding: 11px 12px; margin-top: 14px; font-size: 12px; color: #7E4238; }
.flags b { display: block; margin-bottom: 3px; }
.cst { display: inline-block; border-radius: 999px; padding: 2px 7px; font-size: 9px; font-weight: 900; margin-left: 6px; vertical-align: 1px; }
.cst.vendu { background: #DDEDDD; color: #24482E; }
.cst.envente { background: #E3EBF2; color: #334A66; }
.cst.estimation { background: #ECE7DC; color: #6B675D; }
.cost { font-size: 11px; color: var(--muted); background: #F7F5EF; border-radius: 11px; padding: 9px 11px; margin-top: 14px; }
.cost b { color: var(--ink2); }
.stale { background: #FFF3DA; border-radius: 13px; padding: 11px 12px; margin-top: 11px; font-size: 12px; color: #6E5620; }
.stale b { color: #5A4516; }
.stale .row { margin-top: 8px; }
.stale .btn2 { padding: 9px 8px; }
.alert { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #FFF3DA; border-radius: 15px; padding: 12px 13px; margin: -10px 0 22px; font-size: 12px; color: #6E5620; font-weight: 700; }
.idcard .rtitle { margin-top: 4px; }
.prices3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 6px; }
.prices3 label { font-size: 9px; font-weight: 800; color: var(--muted); display: block; margin-bottom: 3px; }
.prices3 input { width: 100%; border: 1px solid #D5D0C5; border-radius: 10px; padding: 8px; font-size: 14px; background: #fff; }
.price .d { font-size: 9px; color: var(--muted); margin-top: 2px; }
a.comp { text-decoration: none; color: inherit; }
.comp .lk { font-size: 10px; font-weight: 900; color: #425B80; margin-top: 2px; }
.speed b { color: var(--ink2); }
.newp { display: flex; align-items: center; gap: 10px; background: #F7F5EF; border: 1px solid var(--line2); border-radius: 13px; padding: 10px 12px; margin-top: 10px; }
.newp .lb { font-size: 11px; font-weight: 900; color: #4D493F; }
.newp .src { font-size: 10px; color: var(--muted); }
.newp .src a { color: #425B80; font-weight: 800; text-decoration: none; }
.newp .in { position: relative; width: 96px; margin-left: auto; flex: none; }
.newp .in input { width: 100%; border: 1px solid #D5D0C5; border-radius: 10px; padding: 7px 22px 7px 9px; font-size: 15px; font-weight: 900; background: #fff; }
.newp .in span { position: absolute; right: 8px; top: 8px; font-weight: 900; color: #6D695F; }
.disc { font-size: 12px; margin-top: 7px; color: var(--muted); }
.disc b { color: #1D4D32; }

<script>
'use strict';

/* ==========================================================================
   Constantes
   ========================================================================== */
// Version de CETTE page. À modifier en même temps que public/version.json à chaque livraison.
const APP_VERSION = '4.0.1';
const APP_DATE = '2026-09-21';

const STORE = { settings: 'vmc-web-settings', sales: 'vmc-web-sales', keys: 'vmc-web-keys' };
const PHOTO_MAX = 1280;   // côté max (px) : garde la requête sous la limite Vercel de 4,5 Mo
const PHOTO_Q = 0.72;
const THUMB_MAX = 240;
const TIMEOUT_MS = 95000;

const SLOTS = [
  { role: 'general', icon: '📦', title: 'Vue générale', sub: 'Objet entier, bien éclairé', req: true },

  { role: 'defect', icon: '🩹', title: 'Défaut éventuel', sub: 'Rayure, choc, usure, manque…' },
];

// Catalogue de secours, remplacé au démarrage par /api/providers (source : shared/ai).
const FALLBACK_PROVIDERS = [
  { id: 'openai', label: 'OpenAI', defaultModel: 'gpt-6-astra', suggestedModels: ['gpt-6-astra'], supportsWebSearch: true, keyPrefix: 'sk-', keyUrl: 'https://platform.openai.com/api-keys', hint: 'Clé du tableau de bord OpenAI.' },
  { id: 'anthropic', label: 'Anthropic (Claude)', defaultModel: 'claude-opus-5', suggestedModels: ['claude-opus-5'], supportsWebSearch: true, keyPrefix: 'sk-ant-', keyUrl: 'https://console.anthropic.com/settings/keys', hint: 'Clé de la console Anthropic.' },
  { id: 'gemini', label: 'Google Gemini', defaultModel: 'gemini-2.5-pro', suggestedModels: ['gemini-2.5-pro'], supportsWebSearch: true, keyUrl: 'https://aistudio.google.com/apikey', hint: 'Clé Google AI Studio.' },
  { id: 'mistral', label: 'Mistral', defaultModel: 'pixtral-large-latest', suggestedModels: ['pixtral-large-latest'], supportsWebSearch: false, keyUrl: 'https://console.mistral.ai/api-keys', hint: 'Clé de la console Mistral.' },
];

/* ==========================================================================
   Stockage local (le navigateur peut le refuser : navigation privée, etc.)
   ========================================================================== */
const store = {
  get(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch { toast('Stockage du navigateur plein ou indisponible.'); return false; }
  },
};

/* ==========================================================================
   État
   ========================================================================== */
const S = {
  screen: 'home',
  providers: FALLBACK_PROVIDERS,
  settings: Object.assign({ provider: 'openai', models: {}, webSearch: true, defaultLocation: 'France' }, store.get(STORE.settings, {})),
  keys: store.get(STORE.keys, {}),
  sales: store.get(STORE.sales, []),
  photos: {},               // role → { dataUrl, thumb }
  notes: '', ref: '', zone: '',
  result: null, asking: 0,
  loading: false, step: 0,
  filter: 'all',
  showKey: false,
  models: [],               // modèles renvoyés par la vérification de clé
  msg: null,                // message de l'écran Réglages
  busy: false,
  editing: null,            // vente en cours d'édition
  kit: null,                // kit de publication ouvert
  identity: null,           // étape 1 terminée, en attente de l'étude de marché
  buy: { context: 'brocante', photos: {}, notes: '', asking: '', identity: null, result: null, loading: false, phase: 'idle', error: null, startedAt: 0, checked: {} },
  phase: 'idle',            // idle | identify | market
  marketError: null,
  startedAt: 0,
  update: { state: 'checking' }, // checking | uptodate | available | offline
};
S.zone = S.settings.defaultLocation || 'France';

/* --------------------------------------------------------------------------
   Reprise après actualisation (glisser vers le bas) : on conserve l'onglet,
   la position de défilement et l'objet en cours (texte + photos + résultat).
   -------------------------------------------------------------------------- */
const SCREENS = ['home', 'sell', 'buy', 'sales', 'settings'];
const DRAFT_KEY = 'vmc-web-draft';
const SCROLL_KEY = 'vmc-web-scroll';

function rememberScreen() {
  try { history.replaceState(null, '', S.screen === 'home' ? location.pathname : `#${S.screen}`); } catch { /* sans effet */ }
}

let draftTimer = null;
/** Enregistre l'objet en cours (appel groupé pour ne pas écrire à chaque touche). */
function saveDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    const empty = !Object.keys(S.photos).length && !S.notes && !S.ref && !S.result && !S.identity;
    try {
      if (empty) localStorage.removeItem(DRAFT_KEY);
      else localStorage.setItem(DRAFT_KEY, JSON.stringify({ notes: S.notes, ref: S.ref, zone: S.zone, result: S.result, asking: S.asking, identity: S.identity }));
    } catch { /* stockage indisponible */ }
    photoDB.run('readwrite', (st) => (empty ? st.delete('__draft__') : st.put(S.photos, '__draft__')));
  }, 400);
}
function clearDraft() {
  S.photos = {}; S.notes = ''; S.ref = ''; S.result = null; S.asking = 0; S.identity = null; S.marketError = null;
  saveDraft();
}
async function restoreDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch { d = null; }
  const photos = await photoDB.get('__draft__');
  if (!d && !photos) return false;
  if (d) {
    S.notes = d.notes || ''; S.ref = d.ref || ''; S.zone = d.zone || S.zone;
    S.result = d.result || null; S.asking = d.asking || 0; S.identity = d.identity || null;
  }
  if (photos && typeof photos === 'object' && !Array.isArray(photos)) S.photos = photos;
  return true;
}

/* ==========================================================================
   Utilitaires
   ========================================================================== */
const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const euro = (n) => `${Math.round(Number(n) || 0)} €`;
const pct = (n) => `${Math.round((Number(n) || 0) * 100)} %`;
const safeUrl = (u) => (/^https?:\/\//i.test(String(u || '')) ? String(u) : '#');
const provider = () => S.providers.find((p) => p.id === S.settings.provider) || S.providers[0];
const currentKey = () => (S.keys[S.settings.provider] || '').trim();
const currentModel = () => (S.settings.models[S.settings.provider] || '').trim() || provider().defaultModel;
const saveSettings = () => store.set(STORE.settings, S.settings);
const saveKeys = () => store.set(STORE.keys, S.keys);
const saveSales = () => store.set(STORE.sales, S.sales);
const statusLabel = { draft: 'BROUILLON', listed: 'EN LIGNE', sold: 'VENDU' };

let toastTimer;
function toast(text) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = text;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
}

/** Appel de l'API du projet, avec la clé saisie dans Réglages en en-tête. */
async function api(path, body, { withKey = true, timeout = TIMEOUT_MS } = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  const headers = { 'Content-Type': 'application/json' };
  if (withKey && currentKey()) headers['x-ai-key'] = currentKey();
  try {
    const res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers,
      body: body ? JSON.stringify(body) : undefined,
      signal: ctrl.signal,
    });
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch { /* réponse non JSON (délai Vercel, etc.) */ }
    if (!res.ok) {
      if (res.status === 504 || /FUNCTION_INVOCATION_TIMEOUT/.test(text)) {
        throw new Error('Délai dépassé côté serveur (60 s). Désactive la recherche web ou choisis un modèle plus rapide dans Réglages.');
      }
      if (res.status === 413 || /PAYLOAD_TOO_LARGE/.test(text)) {
        throw new Error('Photos trop lourdes pour le serveur. Retire une vue ou reprends les photos.');
      }
      throw new Error(data?.error || `Erreur serveur (${res.status}).`);
    }
    if (!data) throw new Error('Réponse illisible du serveur.');
    return data;
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('Pas de réponse après 95 s. Vérifie ta connexion et réessaie.');
    if (err instanceof TypeError) throw new Error('Serveur injoignable. Vérifie ta connexion.');
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/** Redimensionne une photo (JPEG) pour limiter le poids envoyé. */
function resizeImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * ratio);
      const h = Math.round(img.naturalHeight * ratio);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible.')); };
    img.src = url;
  });
}

/* ==========================================================================
   Rendu
   ========================================================================== */

  rememberScreen();
  document.querySelectorAll('#tabs button').forEach((b) => {
    b.classList.toggle('on', b.dataset.to === S.screen);

  renderKit();
}

function stats() {
  const by = (s) => S.sales.filter((x) => x.status === s);
  return {
    draft: by('draft').length, listed: by('listed').length, sold: by('sold').length,
    potential: S.sales.filter((x) => x.status !== 'sold').reduce((a, x) => a + (+x.askingPrice || 0), 0),
    revenue: by('sold').reduce((a, x) => a + (+(x.soldPrice ?? x.askingPrice) || 0), 0),
  };
}

const salePrice = (x) => (x.status === 'sold' ? (x.soldPrice ?? x.askingPrice) : x.askingPrice);

/* --- Accueil ------------------------------------------------------------- */

  <div class="between"><div class="h2">Derniers objets</div>${S.sales.length ? '<button class="link" style="width:auto;padding:0 0 10px" data-act="go" data-to="sales">Tout voir</button>' : ''}</div>
  ${recent.length ? recent.map((x) => `

/**
 * Délai de vente estimé pour un prix donné, par interpolation entre les trois
 * points fournis par l'IA (vente rapide, conseillé, prix haut).
 */
function saleSpeed(r, price) {
  const pts = [
    { p: r.quickSalePrice, lo: r.quickSaleDaysLow ?? Math.round(r.saleSpeedDaysLow * 0.5), hi: r.quickSaleDaysHigh ?? Math.round(r.saleSpeedDaysHigh * 0.5) },
    { p: r.suggestedPrice, lo: r.saleSpeedDaysLow, hi: r.saleSpeedDaysHigh },
    { p: r.estimatedHigh, lo: r.highPriceDaysLow ?? r.saleSpeedDaysLow * 2, hi: r.highPriceDaysHigh ?? r.saleSpeedDaysHigh * 2 },
  ].filter((x) => Number.isFinite(x.p)).sort((a, b) => a.p - b.p);
  const x = Number(price) || r.suggestedPrice;
  const first = pts[0]; const last = pts[pts.length - 1];
  if (x <= first.p) return { low: first.lo, high: first.hi, zone: 'bas' };
  if (x > last.p) {
    // Au-delà du prix haut : le délai s'allonge vite et devient incertain.
    const k = Math.pow(x / last.p, 2);
    return { low: Math.round(last.lo * k), high: Math.round(last.hi * k), zone: 'hors' };
  }
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i]; const b = pts[i + 1];
    if (x >= a.p && x <= b.p) {
      const t = b.p === a.p ? 0 : (x - a.p) / (b.p - a.p);
      return { low: Math.round(a.lo + t * (b.lo - a.lo)), high: Math.round(a.hi + t * (b.hi - a.hi)), zone: 'ok' };
    }
  }
  return { low: r.saleSpeedDaysLow, high: r.saleSpeedDaysHigh, zone: 'ok' };
}
/** Écart en % entre un prix d'occasion et le prix neuf (négatif = moins cher). */
function discountPct(r, price) {
  const np = Number(r.newPrice) || 0; const p = Number(price) || 0;
  if (!np || !p) return null;
  const d = Math.round((p / np - 1) * 100);
  return d > 0 ? `+${d}` : `${d}`;
}
function discountText(r, price) {
  const np = Number(r.newPrice) || 0;
  if (!np) return 'Renseigne le prix neuf pour voir la remise par rapport au neuf.';
  const d = discountPct(r, price);
  const n = Number(d);
  const hint = n >= 0 ? ' <span style="color:#8A6A22">— au prix du neuf ou plus : peu d’acheteurs choisiront l’occasion</span>'
    : n > -20 ? ' <span style="color:#8A6A22">— remise faible pour de l’occasion</span>' : '';
  return `À ${euro(price)}, soit <b>${d} %</b> par rapport au neuf (${euro(np)}).${hint}`;
}
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

/** Saisonnalité : 12 barres (une par mois), le mois en cours mis en évidence. */
function seasonHtml(r) {
  const se = r.seasonality;
  if (!se || !Array.isArray(se.monthlyDemand) || se.monthlyDemand.length !== 12) return '';
  const now = new Date().getMonth();
  const max = Math.max(...se.monthlyDemand, 1);
  const best = se.monthlyDemand.map((v, i) => ({ v, i })).filter((x) => x.v >= max * 0.9).map((x) => MONTHS[x.i]);
  const flat = Math.max(...se.monthlyDemand) - Math.min(...se.monthlyDemand) < 20;
  const label = { haute: 'Haute saison', moyenne: 'Saison moyenne', basse: 'Basse saison' }[se.currentLevel] || 'Saison moyenne';
  return `
    <div class="season" role="img" aria-label="Demande par mois, de janvier à décembre : ${se.monthlyDemand.join(', ')} sur 100. Mois en cours : ${MONTHS[now]}.">
      <div class="hd"><span>Saisonnalité${flat ? ' — peu marquée' : ''}</span><span class="lvl ${esc(se.currentLevel)}">${label} en ${MONTHS[now]}</span></div>
      <div class="bars">${se.monthlyDemand.map((v, i) => `<div class="bar${i === now ? ' now' : ''}" style="height:${Math.max(5, Math.round((v / 100) * 100))}%" title="${MONTHS[i]} : demande ${v}/100"></div>`).join('')}</div>
      <div class="mo">${'JFMAMJJASOND'.split('').map((m, i) => `<span class="${i === now ? 'now' : ''}">${m}</span>`).join('')}</div>
      <div class="adv">${se.advice ? esc(se.advice) : (flat ? 'Pas de période nettement plus favorable : tu peux vendre maintenant.' : `Meilleure période : ${best.join(', ')}.`)}</div>
    </div>`;
}

function compSummary(list) {
  const n = (st) => list.filter((c) => c.status === st).length;
  const parts = [];
  if (n('vendu')) parts.push(`${n('vendu')} vente(s) conclue(s)`);
  if (n('en vente')) parts.push(`${n('en vente')} annonce(s) en cours`);
  if (n('estimation')) parts.push(`${n('estimation')} estimation(s) du modèle`);
  const hint = n('vendu') ? 'Les ventes conclues sont les références les plus fiables.' : 'Aucune vente conclue trouvée : les prix affichés surestiment souvent le marché.';
  return `${parts.join(' · ')}. ${hint}`;
}

/* --- Coût des analyses -------------------------------------------------- */
const USAGE_KEY = 'vmc-web-usage';
const PRICING_URL = {
  openai: 'https://openai.com/api/pricing/',
  anthropic: 'https://www.anthropic.com/pricing#api',
  gemini: 'https://ai.google.dev/gemini-api/docs/pricing',
  mistral: 'https://mistral.ai/pricing',
};
const priceKey = (provider, model) => `${provider}:${model}`;
function priceFor(provider, model) { return (S.settings.prices || {})[priceKey(provider, model)] || null; }

/** Coût en dollars, ou null si les tarifs du modèle ne sont pas renseignés. */
function costOf(usage, provider, model) {
  const pr = priceFor(provider, model);
  if (!pr || (!pr.in && !pr.out && !pr.search) || !usage) return null;
  return (usage.inputTokens / 1e6) * (pr.in || 0) + (usage.outputTokens / 1e6) * (pr.out || 0) + (usage.webSearches / 1000) * (pr.search || 0);
}
function money(usd) {
  if (usd == null) return '';
  const rate = Number(S.settings.usdToEur) || 0;
  const fmt = (v, cur) => `${v < 0.01 ? v.toFixed(4) : v.toFixed(2)}\u202f${cur}`.replace('.', ',');
  return rate ? `${fmt(usd * rate, '€')} (${fmt(usd, '$')})` : fmt(usd, '$');
}
const nf = (n) => Number(n || 0).toLocaleString('fr-FR');
function costLine(usage, provider, model) {
  const c = costOf(usage, provider, model);
  const detail = `${nf(usage.inputTokens)} jetons en entrée · ${nf(usage.outputTokens)} en sortie · ${nf(usage.webSearches)} recherche(s) web`;
  return `💶 Coût de l’analyse : ${c != null ? `<b>≈ ${money(c)}</b>` : '<b>tarifs non renseignés</b> (Réglages → Modèle)'}<br>${detail}`;
}
function loadUsageLog() { return store.get(USAGE_KEY, []); }
function logUsage(step, usage, provider, model) {
  if (!usage) return;
  const log = loadUsageLog();
  log.push({ at: new Date().toISOString(), step, provider, model, usage, cost: costOf(usage, provider, model) });
  store.set(USAGE_KEY, log.slice(-500));
}
function usageSummary() {
  const log = loadUsageLog();
  const now = new Date();
  const month = log.filter((x) => { const d = new Date(x.at); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  // Un coût non calculé à l'époque (tarifs absents) est recalculé avec les tarifs actuels.
  const sum = (arr) => arr.reduce((a, x) => a + (x.cost ?? costOf(x.usage, x.provider, x.model) ?? 0), 0);
  const analyses = (arr) => arr.filter((x) => x.step === 'Identification').length;
  const unknown = log.some((x) => x.cost == null && costOf(x.usage, x.provider, x.model) == null);
  return { month: { n: analyses(month), cost: sum(month) }, all: { n: analyses(log), cost: sum(log) }, unknown };
}

/* --- Relances : ventes en ligne depuis trop longtemps -------------------- */
const DAY = 86400000;
function staleInfo(x) {
  if (x.status !== 'listed' || !x.listedAt) return null;
  if (x.snoozeUntil && Date.now() < new Date(x.snoozeUntil).getTime()) return null;
  const base = new Date(x.lastPriceDropAt || x.listedAt).getTime();
  const days = Math.floor((Date.now() - base) / DAY);
  const sp = saleSpeed(x, x.askingPrice);
  if (days <= sp.high) return null;
  const floorPrice = Math.round((x.quickSalePrice || x.askingPrice * 0.8) * 0.9);
  const next = Math.max(Math.round(x.askingPrice * 0.92), floorPrice);
  const totalDays = Math.floor((Date.now() - new Date(x.listedAt).getTime()) / DAY);
  return { days, totalDays, sp, next, atFloor: x.askingPrice <= floorPrice || next >= x.askingPrice };
}
function staleHtml(x) {
  const st = staleInfo(x);
  if (!st) return '';
  if (st.atFloor) {
    return `<div class="stale">⏳ <b>En ligne depuis ${st.totalDays} j</b> (délai estimé ${st.sp.low}–${st.sp.high} j), et le prix est déjà au plancher. Essaie une autre plateforme, de nouvelles photos ou un titre plus précis.
      <div class="row"><button class="btn2" data-act="kitFromSale" data-id="${esc(x.id)}">Publier ailleurs</button><button class="btn2" data-act="snooze" data-id="${esc(x.id)}">Plus tard (7 j)</button></div></div>`;
  }
  const pctDrop = Math.round((st.next / x.askingPrice - 1) * 100);
  return `<div class="stale">⏳ <b>En ligne depuis ${st.totalDays} j</b>, au-delà du délai estimé (${st.sp.low}–${st.sp.high} j). Baisser à <b>${euro(st.next)}</b> (${pctDrop} %) ?
    <div class="row"><button class="btn2" data-act="dropPrice" data-id="${esc(x.id)}" data-v="${st.next}">Passer à ${euro(st.next)}</button><button class="btn2" data-act="snooze" data-id="${esc(x.id)}">Plus tard (7 j)</button></div></div>`;
}

function speedText(r, price) {
  const sp = saleSpeed(r, price);
  const txt = `Vente estimée à ${euro(price || r.suggestedPrice)} : <b>${sp.low}–${sp.high} jours</b>`;
  return sp.zone === 'hors' ? `${txt} <span style="color:#8A6A22">(au-dessus du marché, vente incertaine)</span>` : txt;
}

function marketUrl(name, query) {
  const q = encodeURIComponent(String(query || '').trim());
  const n = String(name || '').toLowerCase();
  if (n.includes('leboncoin')) return `https://www.leboncoin.fr/recherche?text=${q}`;
  if (n.includes('ebay')) return `https://www.ebay.fr/sch/i.html?_nkw=${q}`;
  if (n.includes('vinted')) return `https://www.vinted.fr/catalog?search_text=${q}`;
  if (n.includes('momox')) return 'https://www.momox.fr/';
  if (n.includes('facebook')) return `https://www.facebook.com/marketplace/search/?query=${q}`;
  if (n.includes('backmarket') || n.includes('back market')) return `https://www.backmarket.fr/fr-fr/search?q=${q}`;
  return `https://www.google.com/search?q=${encodeURIComponent(`${query} occasion ${name}`)}`;
}

/* ==========================================================================
   Version et mises à jour
   ========================================================================== */
const frDate = (iso) => { try { return new Date(`${iso}T12:00:00`).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch { return iso; } };

/** Compare deux versions « 3.10.2 » : > 0 si a est plus récente. */
function cmpVersion(a, b) {
  const pa = String(a).split('.').map(Number); const pb = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d;
  }
  return 0;
}

/** Interroge le serveur (hors cache) pour connaître la dernière version publiée. */
async function checkUpdate(manual) {
  S.update = { state: 'checking' };
  if (S.screen === 'settings') render();
  try {
    const res = await fetch(`/version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error();
    const latest = await res.json();
    const newer = cmpVersion(latest.version, APP_VERSION) > 0;
    S.update = { state: newer ? 'available' : 'uptodate', latest, checkedAt: new Date() };
    if (newer && !manual) toast(`Mise à jour ${latest.version} disponible : voir Réglages.`);
  } catch {
    S.update = { state: 'offline', checkedAt: new Date() };
  }
  render();
}

/** Recharge la page en contournant le cache du service worker. */
async function applyUpdate() {
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) { await reg.update(); await reg.unregister(); }
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map((k) => caches.delete(k))); }
  } catch { /* on recharge quand même */ }
  location.reload();
}

function versionHtml() {
  const u = S.update;
  let status = '<span class="st"><span class="dot"></span>Vérification des mises à jour…</span>';
  if (u.state === 'uptodate') status = '<span class="st ok"><span class="dot"></span>À jour</span>';
  if (u.state === 'offline') status = '<span class="st"><span class="dot"></span>Vérification impossible (hors connexion)</span>';
  if (u.state === 'available') {
    status = `<span class="st up"><span class="dot"></span>Mise à jour disponible : version ${esc(u.latest.version)} du ${esc(frDate(u.latest.date))}</span>
      ${u.latest.notes ? `<div style="margin-top:4px">${esc(u.latest.notes)}</div>` : ''}
      <div><button data-act="applyUpdate">Mettre à jour maintenant</button></div>`;
  }
  return `
  <div class="ver">
    Vends-moi ça — <b>version ${APP_VERSION}</b> du ${esc(frDate(APP_DATE))}<br>
    ${status}
    ${u.state !== 'checking' && u.state !== 'available' ? '<div><button class="link" style="width:auto;padding:8px 0 0;margin:0 auto;background:none;color:#75663C;font-size:11px" data-act="checkUpdate">Vérifier maintenant</button></div>' : ''}
  </div>`;
}

let buyDraftTimer = null;
function saveBuyDraft() {
  clearTimeout(buyDraftTimer);
  buyDraftTimer = setTimeout(() => {
    const b = S.buy;
    const empty = !Object.keys(b.photos).length && !b.notes && !b.asking && !b.result && !b.identity;
    try {
      if (empty) localStorage.setItem(BUYDRAFT_KEY, JSON.stringify({ context: b.context }));
      else localStorage.setItem(BUYDRAFT_KEY, JSON.stringify({ context: b.context, notes: b.notes, asking: b.asking, identity: b.identity, result: b.result }));
    } catch { /* stockage indisponible */ }
    photoDB.run('readwrite', (st) => (Object.keys(b.photos).length ? st.put(b.photos, '__buydraft__') : st.delete('__buydraft__')));
  }, 400);
}
async function restoreBuyDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(BUYDRAFT_KEY) || 'null'); } catch { d = null; }
  if (d) Object.assign(S.buy, {
    context: d.context === 'annonce' ? 'annonce' : 'brocante',
    notes: d.notes || '', asking: d.asking || '', identity: d.identity || null, result: d.result || null,
  });
  const photos = await photoDB.get('__buydraft__');
  if (photos && typeof photos === 'object' && !Array.isArray(photos)) S.buy.photos = photos;

/** Position du prix demandé sur l'échelle bonne affaire / moyen / trop cher. */
function buyVerdictHtml(r) {
  const ask = buyAskingPrice(r);
  if (!ask) return '<span class="small">Indique le prix demandé pour le situer sur l’échelle.</span>';
  const vsAvg = Math.round((ask / r.averagePrice - 1) * 100);
  const vs = r.averagePrice ? ` (${vsAvg > 0 ? '+' : ''}${vsAvg} % par rapport au prix moyen)` : '';
  const src = Number(S.buy.asking) ? 'Prix demandé' : 'Prix lu sur l’annonce';
  if (ask <= r.goodDealPrice) return `${src} ${euro(ask)} : <b style="color:#24482E">bonne affaire</b>${vs}.`;
  if (ask < r.tooExpensivePrice) return `${src} ${euro(ask)} : <b>dans la moyenne</b>${vs}. Négocier vers ${euro(r.goodDealPrice)}–${euro(r.averagePrice)} reste raisonnable.`;
  return `${src} ${euro(ask)} : <b style="color:#7E4238">trop cher</b>${vs}. Ne pas dépasser ${euro(r.averagePrice)}.`;
}

function gaugeHtml(r) {
  const max = Math.max(r.tooExpensivePrice * 1.3, buyAskingPrice(r) * 1.1, 1);
  const pos = (v) => Math.min(100, Math.max(0, (v / max) * 100));
  const ask = buyAskingPrice(r);
  return `<div class="gauge" style="--g:${pos(r.goodDealPrice)}%;--b:${pos(r.tooExpensivePrice)}%" role="img" aria-label="Échelle de prix : bonne affaire jusqu’à ${r.goodDealPrice} €, trop cher à partir de ${r.tooExpensivePrice} €${ask ? `, prix demandé ${ask} €` : ''}.">

  <div id="buyResult">${b.result ? buyResultHtml(b.result) : b.identity ? `
    <div class="card result idcard">

      ${b.error ? `<div class="msg ko">L’estimation du prix a échoué : ${esc(b.error)}</div>
        <button class="btn" style="margin-top:12px" data-act="retryBuy">Relancer l’estimation du prix</button>` : ''}

}

let buyTimer = null;
function buyTick() {
  clearInterval(buyTimer);
  buyTimer = setInterval(() => {
    if (!S.buy.loading) return clearInterval(buyTimer);
    if (S.buy.phase === 'market' && (Date.now() - S.buy.startedAt) > 15000) S.buy.step = 2;
    const el = $('#buyProgress'); if (el) el.innerHTML = buyProgressHtml();
  }, 1000);
}

function buyPayload() {
  return { notes: S.buy.notes, locationHint: S.settings.defaultLocation || 'France', provider: S.settings.provider, model: currentModel(), webSearch: !!S.settings.webSearch };
}

async function runBuy(demo) {
  const b = S.buy;
  if (!demo && !b.photos.main) { toast(b.context === 'annonce' ? 'Ajoute la capture de l’annonce.' : 'Ajoute la photo de l’objet.'); return; }
  if (!demo && !readiness().ok) {
    if (confirm('Aucune clé API configurée. Ouvrir les Réglages ?')) { S.screen = 'settings'; render(); }
    return;
  }
  Object.assign(b, { loading: true, phase: 'identify', step: 0, result: null, identity: null, error: null, checked: {}, startedAt: Date.now() });
  render(); buyTick();
  $('#buyProgress')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (demo) {
    try { b.result = await api('/api/buy', { demo: true, context: b.context }); saveBuyDraft(); }
    catch (err) { toast(err.message); }
    finally { endBuy(); }
    return;
  }
  try {
    const images = ['main', 'detail'].map((k) => b.photos[k]?.dataUrl).filter(Boolean);
    const id = await api('/api/identify', { imagesDataUrl: images, ...buyPayload() });
    logUsage('Identification', id.usage, id.provider, id.usedModel);
    b.identity = id; saveBuyDraft();
  } catch (err) { toast(err.message); endBuy(); return; }
  await runBuyMarket();
}

async function runBuyMarket() {
  const b = S.buy;
  Object.assign(b, { loading: true, phase: 'market', step: 1, error: null });
  if (!b.startedAt) b.startedAt = Date.now();
  render(); buyTick();
  try {
    const data = await api('/api/buy', { identity: b.identity, context: b.context, askingPrice: Number(b.asking) || 0, ...buyPayload() });
    logUsage('Prix d’achat', {
      inputTokens: Math.max(0, (data.usage?.inputTokens || 0) - (b.identity.usage?.inputTokens || 0)),
      outputTokens: Math.max(0, (data.usage?.outputTokens || 0) - (b.identity.usage?.outputTokens || 0)),
      webSearches: Math.max(0, (data.usage?.webSearches || 0) - (b.identity.usage?.webSearches || 0)),
    }, data.provider, data.usedModel);
    b.result = data; b.identity = null;
    if (!b.asking && data.askingPriceDetected) b.asking = String(data.askingPriceDetected);
    saveBuyDraft();
  } catch (err) {
    b.error = err.message; saveBuyDraft();
  } finally { endBuy(); }
}

function endBuy() {
  clearInterval(buyTimer);
  Object.assign(S.buy, { loading: false, phase: 'idle', startedAt: 0 });
  if (S.screen === 'buy') { render(); $('#buyResult .result')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

/* ==========================================================================
   Kit de publication
   ========================================================================== */
const MAIN_PLATFORMS = ['Leboncoin', 'Vinted', 'eBay', 'Facebook Marketplace'];
const TITLE_MAX = { ebay: 80 };   // seule limite documentée avec certitude

const pkey = (name) => String(name || '').toLowerCase();
const slug = (t) => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'objet';

/** Page « déposer une annonce » de chaque plateforme (ouvre l'app si installée). */
function publishUrl(name) {
  const n = pkey(name);
  if (n.includes('leboncoin')) return 'https://www.leboncoin.fr/deposer-une-annonce';
  if (n.includes('vinted')) return 'https://www.vinted.fr/items/new';
  if (n.includes('ebay')) return 'https://www.ebay.fr/sl/sell';
  if (n.includes('facebook')) return 'https://www.facebook.com/marketplace/create/item';
  if (n.includes('back')) return 'https://www.backmarket.fr/';
  if (n.includes('momox')) return 'https://www.momox.fr/';
  return marketUrl(name, '');
}

/** Photos pleine taille de l'analyse en cours, dans l'ordre des vues. */
function currentPhotos() { return SLOTS.map((x) => S.photos[x.role]?.dataUrl).filter(Boolean); }

/** Photos pleine taille des ventes : IndexedDB (localStorage serait trop petit). */
const photoDB = {
  _db: null,
  open() {
    if (!this._db) {
      this._db = new Promise((resolve, reject) => {
        const req = indexedDB.open('vmc-photos', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('photos');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return this._db;
  },
  async run(mode, fn) {
    try {
      const db = await this.open();
      return await new Promise((resolve) => {
        const tx = db.transaction('photos', mode);
        const req = fn(tx.objectStore('photos'));
        tx.oncomplete = () => resolve(req ? req.result : true);
        tx.onerror = tx.onabort = () => resolve(null);
      });
    } catch { return null; }
  },
  put(id, photos) { return photos?.length ? this.run('readwrite', (st) => st.put(photos, id)) : null; },
  get(id) { return this.run('readonly', (st) => st.get(id)); },
  del(id) { return this.run('readwrite', (st) => st.delete(id)); },
};

function openKit(base, platform) {
  const names = [...(base.item.platformAdvice || []).map((p) => p.name), ...MAIN_PLATFORMS];
  const seen = new Set();
  base.platforms = names.filter((n) => { const k = pkey(n); if (seen.has(k)) return false; seen.add(k); return true; });
  base.platform = platform || base.platforms[0];
  base.copied = {};
  S.kit = base;
  renderKit();
}

/** Valeurs adaptées à la plateforme choisie. */
function kitFields() {
  const k = S.kit; const it = k.item;
  const advice = (it.platformAdvice || []).find((p) => pkey(p.name) === pkey(k.platform)) || {};
  const max = Object.entries(TITLE_MAX).find(([key]) => pkey(k.platform).includes(key))?.[1];
  const title = max && it.title.length > max ? it.title.slice(0, max - 1).trim() + '…' : it.title;
  return {
    title, titleCut: title !== it.title, max,
    description: it.description,
    price: Math.round(it.askingPrice || it.suggestedPrice || 0),
    category: advice.category || it.category || '',
    condition: advice.condition || it.condition || '',
    brand: [it.brand, it.model].filter(Boolean).join(' '),
  };
}

function renderKit() {
  const box = $('#kit');
  const k = S.kit;
  if (!k) { box.innerHTML = ''; if (!S.editing) document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  const f = kitFields();
  const copyBtn = (id, icon, label, preview) => `
    <button class="copy${k.copied[id] ? ' done' : ''}" data-act="kitCopy" data-f="${id}">
      <span class="ic">${k.copied[id] ? '✓' : icon}</span>
      <span class="tx"><b>${label}</b><span>${esc(preview)}</span></span>
      <span class="go">${k.copied[id] ? 'Copié' : 'Copier'}</span>
    </button>`;
  const row = (label, value) => value ? `<div class="r"><span>${label}</span><b>${esc(value)}</b></div>` : '';
  box.innerHTML = `
  <div class="modal" data-act="closeKit">
    <div class="sheet" data-stop="1">
      <div class="bar"><button data-act="closeKit">Fermer</button><b>Publier l’annonce</b><span style="width:44px"></span></div>
      <div class="in">
        <div class="kitchips">${k.platforms.map((n) => `<button class="chip${pkey(n) === pkey(k.platform) ? ' on' : ''}" data-act="kitPlatform" data-p="${esc(n)}">${esc(n)}</button>`).join('')}</div>

        <div class="kstep"><span class="n">1</span>Photos</div>
        ${k.photos.length ? `
          <div class="kthumbs">${k.photos.map((d) => `<img src="${d}" alt="">`).join('')}</div>
          <div class="row" style="margin-top:0">
            <button class="btn2" data-act="kitSavePhotos">⬇ Enregistrer sur le téléphone</button>
            <button class="btn2" data-act="kitSharePhotos">↗ Partager</button>
          </div>
          <div class="small" style="margin-top:6px">Elles apparaîtront en premier quand ${esc(k.platform)} te demandera d’ajouter des photos.</div>`
        : '<div class="small">Aucune photo conservée pour cette vente : reprends-les directement depuis ta galerie.</div>'}

        <div class="kstep"><span class="n">2</span>Copier les 3 éléments, puis ouvrir ${esc(k.platform)}</div>
        ${copyBtn('title', 'T', `Titre${f.max ? ` (${f.title.length}/${f.max})` : ` (${f.title.length} car.)`}`, f.title)}
        ${f.titleCut ? `<div class="small" style="color:#8A6A22;margin:-3px 0 8px">Titre raccourci à ${f.max} caractères pour ${esc(k.platform)}.</div>` : ''}
        ${copyBtn('desc', '¶', 'Description', f.description)}
        ${copyBtn('price', '€', 'Prix', `${f.price} €`)}
        <div class="small">Dans ${esc(k.platform)}, ouvre le presse-papiers du clavier (📋 dans Gboard ou le clavier Samsung) : les trois éléments y sont, touche-les champ par champ.</div>
        <button class="btn" style="margin-top:12px" data-act="kitOpen">Ouvrir ${esc(k.platform)} ↗</button>

        <div class="kstep"><span class="n">3</span>À choisir dans les menus</div>
        <div class="pick">
          ${row('Catégorie', f.category)}
          ${row('État', f.condition)}
          ${row('Marque', f.brand)}
          ${row('Prix', `${f.price} €`)}
        </div>

        <button class="btn gold" data-act="kitDone">✓ J’ai publié sur ${esc(k.platform)}</button>
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   Actions
   ========================================================================== */
let pendingRole = null;
let pendingTarget = 'sell';
let installPrompt = null;   // évènement « beforeinstallprompt » de Chrome
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
let stepTimer = null;

const actions = {
  go(el) { S.screen = el.dataset.to; S.msg = null; render(); window.scrollTo(0, 0); },

  newSale() {
    clearDraft();
    S.zone = S.settings.defaultLocation || 'France';
    S.screen = 'sell'; render(); window.scrollTo(0, 0);
  },

  pickPhoto(el) {
    pendingRole = el.dataset.role;
    pendingTarget = el.dataset.target === 'buy' ? 'buy' : 'sell';
    const slot = (pendingTarget === 'buy' ? buySlots() : SLOTS).find((x) => x.role === pendingRole);
    $('#picker').innerHTML = `
      <div class="picker" data-act="closePicker">
        <div class="box" data-stop="1">
          <div class="ttl">${esc(slot ? slot.title : 'Photo')}</div>
          <button class="opt" data-act="source" data-src="camera"><span>📷</span>Prendre une photo</button>
          <button class="opt" data-act="source" data-src="file"><span>🖼️</span>Choisir dans la galerie</button>
          <button class="link" data-act="closePicker">Annuler</button>
        </div>
      </div>`;
  },
  closePicker() { $('#picker').innerHTML = ''; },
  source(el) {
    const input = $(el.dataset.src === 'camera' ? '#camera' : '#file');
    $('#picker').innerHTML = '';
    input.value = '';
    input.click();
  },
  async install() {
    if (!installPrompt) return;
    installPrompt.prompt();
    const choice = await installPrompt.userChoice.catch(() => null);
    installPrompt = null;
    if (choice && choice.outcome === 'accepted') toast('Installation en cours…');
    render();
  },
  rmPhoto(el) {
    if (el.dataset.target === 'buy') { delete S.buy.photos[el.dataset.role]; S.buy.result = null; S.buy.identity = null; saveBuyDraft(); render(); return; }
    delete S.photos[el.dataset.role]; S.result = null; saveDraft(); render();
  },

  analyze() { runAnalysis(false); },
  retryMarket() { if (S.identity) { S.startedAt = Date.now(); runMarket(); } },
  demo() { runAnalysis(true); },

  setPrice(el) { S.asking = Number(el.dataset.v) || 0; saveDraft(); refreshResult(); },

  async share() { await shareText(S.result, S.asking); },
  async shareSale(el) { const x = S.sales.find((s) => s.id === el.dataset.id); if (x) await shareText(x, x.askingPrice); },

  save(el) {
    if (!S.result) return;
    const status = el.dataset.status;
    const now = new Date().toISOString();
    const item = Object.assign({}, S.result, {
      id: String(Date.now()), createdAt: now, updatedAt: now,
      thumb: S.photos.general?.small || '',
      status, askingPrice: S.asking || S.result.suggestedPrice,
      listedAt: status === 'listed' ? now : undefined,
    });
    S.sales = [item, ...S.sales];
    if (!saveSales()) { S.sales.shift(); return; }
    photoDB.put(item.id, currentPhotos());
    toast(status === 'listed' ? 'Ajouté à tes ventes en ligne.' : 'Brouillon enregistré.');
    clearDraft();
    S.screen = 'sales'; S.filter = 'all'; render(); window.scrollTo(0, 0);
  },

  filter(el) { S.filter = el.dataset.f; render(); },
  buyContext(el) { S.buy.context = el.dataset.c; S.buy.result = null; saveBuyDraft(); render(); },
  runBuy() { runBuy(false); },
  buyDemo() { runBuy(true); },
  retryBuy() { if (S.buy.identity) { S.buy.startedAt = Date.now(); runBuyMarket(); } },
  buyReset() { S.buy = Object.assign(S.buy, { photos: {}, notes: '', asking: '', identity: null, result: null, error: null, checked: {} }); saveBuyDraft(); render(); window.scrollTo(0, 0); },
  toggleCheck(el) { S.buy.checked[el.dataset.i] = el.checked; },
  goStale() { S.screen = 'sales'; S.filter = 'listed'; render(); window.scrollTo(0, 0); },
  dropPrice(el) {
    const v = Number(el.dataset.v); const now = new Date().toISOString();
    S.sales = S.sales.map((x) => x.id === el.dataset.id ? Object.assign({}, x, {
      priceHistory: [...(x.priceHistory || []), { at: now, from: x.askingPrice, to: v }],
      askingPrice: v, lastPriceDropAt: now, updatedAt: now,
    }) : x);
    saveSales(); render();
    const it = S.sales.find((x) => x.id === el.dataset.id);
    toast(`Prix passé à ${euro(v)}. Pense à le modifier aussi sur ${it?.platform || 'la plateforme'}.`);
  },
  snooze(el) {
    const until = new Date(Date.now() + 7 * DAY).toISOString();
    S.sales = S.sales.map((x) => x.id === el.dataset.id ? Object.assign({}, x, { snoozeUntil: until }) : x);
    saveSales(); render(); toast('Rappel reporté de 7 jours.');
  },
  resetUsage() { if (confirm('Remettre à zéro le suivi des dépenses IA ?')) { store.set(USAGE_KEY, []); render(); } },
  checkUpdate() { checkUpdate(true); },
  applyUpdate() { applyUpdate(); },

  /* --- Kit de publication --- */
  kitFromResult(el) {
    if (!S.result) return;
    openKit({ item: Object.assign({}, S.result, { askingPrice: S.asking || S.result.suggestedPrice }), photos: currentPhotos(), fromResult: true }, el.dataset.p);
  },
  async kitFromSale(el) {
    const item = S.sales.find((x) => x.id === el.dataset.id);
    if (!item) return;
    const photos = (await photoDB.get(item.id)) || (item.thumb ? [item.thumb] : []);
    openKit({ item, photos, fromResult: false }, item.platformAdvice?.[0]?.name);
  },
  kitPlatform(el) { S.kit.platform = el.dataset.p; S.kit.copied = {}; renderKit(); },
  closeKit() { S.kit = null; renderKit(); },
  async kitCopy(el) {
    const f = el.dataset.f; const k = kitFields();
    const text = f === 'title' ? k.title : f === 'desc' ? k.description : String(k.price);
    try {
      await navigator.clipboard.writeText(text);
      S.kit.copied[f] = true; renderKit();
      toast(f === 'title' ? 'Titre copié' : f === 'desc' ? 'Description copiée' : 'Prix copié');
    } catch { toast('Copie impossible : autorise le presse-papiers pour ce site.'); }
  },
  async kitSavePhotos() {
    const photos = S.kit.photos; if (!photos.length) return;
    const base = slug(S.kit.item.title || 'objet');
    for (let i = 0; i < photos.length; i++) {
      const a = document.createElement('a');
      a.href = photos[i]; a.download = `${base}-${i + 1}.jpg`;
      document.body.appendChild(a); a.click(); a.remove();
      await new Promise((r) => setTimeout(r, 350));
    }
    toast(`${photos.length} photo(s) enregistrée(s) dans Téléchargements.`);
  },
  async kitSharePhotos() {
    try {
      const files = await Promise.all(S.kit.photos.map(async (d, i) => new File([await (await fetch(d)).blob()], `${slug(S.kit.item.title || 'objet')}-${i + 1}.jpg`, { type: 'image/jpeg' })));
      if (!navigator.canShare || !navigator.canShare({ files })) throw new Error();
      await navigator.share({ files, title: S.kit.item.title });
    } catch (e) { if (e && e.name !== 'AbortError') actions.kitSavePhotos(); }
  },
  kitOpen() { window.open(publishUrl(S.kit.platform), '_blank', 'noopener'); },
  kitDone() {
    const k = S.kit; const now = new Date().toISOString(); const platform = k.platform;
    if (k.fromResult) {
      const item = Object.assign({}, k.item, {
        id: String(Date.now()), createdAt: now, updatedAt: now, thumb: S.photos.general?.small || '',
        status: 'listed', listedAt: now, platform,
      });
      S.sales = [item, ...S.sales];
      if (!saveSales()) { S.sales.shift(); return; }
      photoDB.put(item.id, k.photos);
      clearDraft();
      S.screen = 'sales'; S.filter = 'all';
    } else {
      S.sales = S.sales.map((x) => x.id === k.item.id ? Object.assign({}, x, {
        status: x.status === 'sold' ? 'sold' : 'listed', listedAt: x.listedAt || now, updatedAt: now,
        platform: x.platform && !x.platform.includes(platform) ? `${x.platform}, ${platform}` : platform,
      }) : x);
      saveSales();
    }
    S.kit = null; render(); window.scrollTo(0, 0);
    toast(`Publié sur ${platform} : la vente est « en ligne ».`);
  },

  edit(el) { const x = S.sales.find((s) => s.id === el.dataset.id); if (x) { S.editing = JSON.parse(JSON.stringify(x)); renderModal(); } },
  closeModal() { S.editing = null; renderModal(); },
  editStatus(el) {
    const d = S.editing; const now = new Date().toISOString(); const st = el.dataset.s;
    d.status = st;
    if (st === 'listed') d.listedAt = d.listedAt || now;
    if (st === 'sold') { d.soldAt = d.soldAt || now; d.soldPrice = d.soldPrice ?? d.askingPrice; } else { d.soldAt = undefined; }
    renderModal();
  },
  saveEdit() {
    const d = S.editing; d.updatedAt = new Date().toISOString();
    S.sales = S.sales.map((x) => (x.id === d.id ? d : x));
    saveSales(); S.editing = null; render(); toast('Vente mise à jour.');
  },
  delete(el) {
    if (!confirm('Supprimer cette vente ? Cette action est définitive.')) return;
    S.sales = S.sales.filter((x) => x.id !== el.dataset.id);
    photoDB.del(el.dataset.id);
    saveSales(); S.editing = null; render(); toast('Vente supprimée.');
  },

  provider(el) { S.settings.provider = el.dataset.id; saveSettings(); S.models = []; S.msg = null; S.showKey = false; render(); },
  toggleKey() { S.showKey = !S.showKey; const k = $('#keyInput'); if (k) k.type = S.showKey ? 'text' : 'password'; render(); },
  clearKey() {
    if (!confirm(`Effacer la clé ${provider().label} de ce navigateur ?`)) return;
    delete S.keys[S.settings.provider]; saveKeys(); S.models = []; S.msg = { kind: 'info', text: 'Clé effacée de ce navigateur.' }; render();
  },
  model(el) { S.settings.models[S.settings.provider] = el.dataset.m; saveSettings(); render(); },

  async verify() {
    const p = provider();
    if (!currentKey() && !p.serverKey) { S.msg = { kind: 'ko', text: 'Saisis d’abord une clé API.' }; render(); return; }
    S.busy = true; S.msg = null; render();
    try {
      const data = await api('/api/models', { provider: p.id }, { timeout: 30000 });
      S.models = data.models || [];
      const model = currentModel();
      const known = !S.models.length || S.models.includes(model);
      S.msg = { kind: 'ok', text: `Clé ${data.origin === 'server' ? 'du serveur ' : ''}valide — ${S.models.length} modèle(s) disponible(s).${known ? '' : ` Attention : « ${model} » n’apparaît pas dans la liste.`}` };
    } catch (err) {
      S.msg = { kind: 'ko', text: err.message };
    } finally {
      S.busy = false; render();
    }
  },

  export() {
    const blob = new Blob([JSON.stringify({ app: 'vends-moi-ca', version: 1, exportedAt: new Date().toISOString(), sales: S.sales }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `vends-moi-ca-ventes-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  import() { $('#importFile').value = ''; $('#importFile').click(); },
};

function stepPayload() {
  return {
    notes: S.notes, knownReference: S.ref, locationHint: S.zone,
    provider: S.settings.provider, model: currentModel(), webSearch: !!S.settings.webSearch,
  };
}

function startTimer(fromStep, toStep, every) {
  clearInterval(stepTimer);
  S.step = fromStep;
  stepTimer = setInterval(() => {
    S.step = Math.min(S.step + 1, toStep);
    const el = $('#progress'); if (el && S.loading) el.innerHTML = progressHtml();
  }, every);
  // Rafraîchit aussi le compteur de secondes.
  const tick = setInterval(() => { if (!S.loading) return clearInterval(tick); const el = $('#progress'); if (el) el.innerHTML = progressHtml(); }, 1000);
}

async function runAnalysis(demo) {
  if (!demo && !S.photos.general) { toast('Ajoute au minimum la photo « Vue générale ».'); return; }
  if (!demo && !readiness().ok) {
    if (confirm('Aucune clé API configurée. Ouvrir les Réglages ?')) { S.screen = 'settings'; render(); }
    return;
  }
  S.loading = true; S.result = null; S.identity = null; S.marketError = null; S.startedAt = Date.now();
  S.phase = 'identify';
  render();
  $('#progress')?.scrollIntoView({ behavior: 'smooth', block: 'center' });

  if (demo) {
    startTimer(0, 2, 350);
    try {
      const data = await api('/api/analyze', { demo: true });
      S.result = data; S.asking = data.suggestedPrice || 0; saveDraft();
    } catch (err) { toast(err.message); }
    finally { endLoading(); }
    return;
  }

  // Étape 1 : identification (photos).
  startTimer(0, 0, 1000);
  try {
    const images = SLOTS.map((x) => S.photos[x.role]?.dataUrl).filter(Boolean);
    const id = await api('/api/identify', { imagesDataUrl: images, ...stepPayload() });
    logUsage('Identification', id.usage, id.provider, id.usedModel);
    S.identity = id; saveDraft();
  } catch (err) {
    toast(err.message); endLoading(); return;
  }
  // Étape 2 : marché (fiche seule, avec recherche web).
  await runMarket();
}

async function runMarket() {
  S.loading = true; S.phase = 'market'; S.marketError = null;
  if (!S.startedAt) S.startedAt = Date.now();
  render();
  startTimer(1, 2, 12000);
  try {
    const data = await api('/api/market', { identity: S.identity, ...stepPayload() });
    const marketUsage = {
      inputTokens: Math.max(0, (data.usage?.inputTokens || 0) - (S.identity.usage?.inputTokens || 0)),
      outputTokens: Math.max(0, (data.usage?.outputTokens || 0) - (S.identity.usage?.outputTokens || 0)),
      webSearches: Math.max(0, (data.usage?.webSearches || 0) - (S.identity.usage?.webSearches || 0)),
    };
    logUsage('Étude de marché', marketUsage, data.provider, data.usedModel);
    S.result = data; S.asking = data.suggestedPrice || 0; S.identity = null;
    saveDraft();
  } catch (err) {
    S.marketError = err.message;
    saveDraft();
  } finally {
    endLoading();
  }
}

function endLoading() {
  clearInterval(stepTimer);
  S.loading = false; S.phase = 'idle'; S.startedAt = 0;
  if (S.screen === 'sell') { render(); $('#result .result')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

function refreshResult() {
  const box = $('#result');
  if (box && S.result) box.innerHTML = resultHtml();
}

async function shareText(item, price) {
  const text = `${item.title}\n\n${item.description}\n\nPrix : ${euro(price)}`;
  if (navigator.share) {
    try { await navigator.share({ title: item.title, text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('Annonce copiée dans le presse-papiers.'); }
  catch { toast('Copie impossible sur ce navigateur.'); }
}

/* ==========================================================================
   Événements
   ========================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  // Un clic dans la feuille modale ne doit pas la fermer.
  if (['closeModal', 'closePicker', 'closeKit'].includes(el.dataset.act) && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const fn = actions[el.dataset.act];
  if (fn) { if (el.tagName !== 'INPUT') e.preventDefault(); fn(el); }
});

document.addEventListener('input', (e) => {
  const el = e.target; const b = el.dataset.bind;
  if (!b) return;
  if (['ref', 'notes', 'zone', 'r.title', 'r.description', 'asking', 'newPrice'].includes(b)) setTimeout(saveDraft, 0);
  const num = (v) => Number(String(v).replace(/[^0-9]/g, '')) || 0;
  switch (b) {
    case 'ref': S.ref = el.value; break;
    case 'b.asking': S.buy.asking = el.value.replace(/[^0-9]/g, ''); saveBuyDraft(); { const v = $('#buyVerdict'); if (v && S.buy.result) v.innerHTML = buyVerdictHtml(S.buy.result); const g = $('#buyGauge'); if (g && S.buy.result) g.innerHTML = gaugeHtml(S.buy.result); } break;
    case 'b.notes': S.buy.notes = el.value; saveBuyDraft(); break;
    case 'notes': S.notes = el.value; break;
    case 'zone': S.zone = el.value; break;
    case 'r.title': S.result.title = el.value; break;
    case 'newPrice': {
      S.result.newPrice = num(el.value);
      const dc = $('#disc'); if (dc) dc.innerHTML = discountText(S.result, S.asking);
      document.querySelectorAll('.price').forEach((pc) => {
        const v = Number(pc.dataset.v); const sp = saleSpeed(S.result, v); const d = discountPct(S.result, v);
        pc.querySelector('.d').textContent = `${sp.low}–${sp.high} j${d != null ? ` · ${d} %` : ''}`;
      });
      break;
    }
    case 'r.description': S.result.description = el.value; break;
    case 'asking':
      S.asking = num(el.value);
      document.querySelectorAll('.price').forEach((p) => {
        const on = Number(p.dataset.v) === S.asking;
        p.classList.toggle('on', on); p.querySelector('.c').textContent = on ? 'SÉLECTIONNÉ' : '';
      });
      { const sp = $('#speed'); if (sp && S.result) sp.innerHTML = speedText(S.result, S.asking); }
      { const dc = $('#disc'); if (dc && S.result) dc.innerHTML = discountText(S.result, S.asking); }
      break;
    case 'key': {
      const v = el.value.trim();
      if (v) S.keys[S.settings.provider] = v; else delete S.keys[S.settings.provider];
      saveKeys();
      const p = provider();
      $('#prefixWarn')?.classList.toggle('hidden', !(p.keyPrefix && v && !v.startsWith(p.keyPrefix)));
      break;
    }
    case 'model': S.settings.models[S.settings.provider] = el.value.trim(); saveSettings(); break;
    case 'defaultLocation': S.settings.defaultLocation = el.value; saveSettings(); break;
    case 'price.in': case 'price.out': case 'price.search': {
      const k = priceKey(S.settings.provider, currentModel());
      const prices = S.settings.prices || (S.settings.prices = {});
      const entry = prices[k] || (prices[k] = {});
      const v = parseFloat(String(el.value).replace(',', '.'));
      entry[b.split('.')[1]] = Number.isFinite(v) ? v : undefined;
      saveSettings();
      break;
    }
    case 'usdToEur': { const v = parseFloat(String(el.value).replace(',', '.')); S.settings.usdToEur = Number.isFinite(v) ? v : undefined; saveSettings(); break; }
    case 'e.askingPrice': S.editing.askingPrice = num(el.value); break;
    case 'e.soldPrice': S.editing.soldPrice = num(el.value); { const v = $('#soldValue'); if (v) v.textContent = euro(S.editing.soldPrice); } break;
    case 'e.platform': S.editing.platform = el.value; break;
    case 'e.title': S.editing.title = el.value; break;
    case 'e.description': S.editing.description = el.value; break;
    case 'e.personalNote': S.editing.personalNote = el.value; break;
  }
});

document.addEventListener('change', (e) => {
  const el = e.target; const b = el.dataset.bind;
  if (b === 'webSearch') { S.settings.webSearch = el.checked; saveSettings(); }
  if (b === 'modelSelect' && el.value) { S.settings.models[S.settings.provider] = el.value; saveSettings(); render(); }
});

async function onPhotoSelected(e) {
  const file = e.target.files?.[0];
  if (!file || !pendingRole) return;
  const role = pendingRole; pendingRole = null;
  const target = pendingTarget; pendingTarget = 'sell';
  try {
    const [dataUrl, thumb, small] = await Promise.all([
      resizeImage(file, PHOTO_MAX, PHOTO_Q),
      resizeImage(file, 520, 0.7),
      resizeImage(file, THUMB_MAX, 0.6),
    ]);
    if (target === 'buy') {
      S.buy.photos[role] = { dataUrl, thumb, small };
      S.buy.result = null; S.buy.identity = null;
      saveBuyDraft();
    } else {
      S.photos[role] = { dataUrl, thumb, small };
      saveDraft();
      S.result = null;
    }
    render();
  } catch (err) {
    toast(err.message);
  }
}
$('#file').addEventListener('change', onPhotoSelected);
$('#camera').addEventListener('change', onPhotoSelected);

$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const incoming = Array.isArray(data) ? data : data.sales;
    if (!Array.isArray(incoming)) throw new Error();
    const ids = new Set(S.sales.map((x) => x.id));
    const added = incoming.filter((x) => x && x.id && !ids.has(x.id));
    S.sales = [...added, ...S.sales].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    saveSales();
    S.msg = { kind: 'ok', text: `${added.length} vente(s) importée(s)${incoming.length - added.length ? `, ${incoming.length - added.length} déjà présente(s)` : ''}.` };
    render();
  } catch {
    toast('Fichier de sauvegarde illisible.');
  }
});

/* ==========================================================================
   Démarrage
   ========================================================================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();          // on affiche notre propre bouton « Installer »
  installPrompt = e;
  if (!S.editing && (S.screen === 'home' || S.screen === 'settings')) render();
});
window.addEventListener('appinstalled', () => { installPrompt = null; toast('Application installée.'); render(); });

window.addEventListener('pagehide', () => {
  try { sessionStorage.setItem(SCROLL_KEY, JSON.stringify({ screen: S.screen, y: window.scrollY })); } catch { /* sans effet */ }
});

(async function init() {
  const fromHash = location.hash.replace('#', '');
  if (SCREENS.includes(fromHash)) S.screen = fromHash;
  await restoreDraft().catch(() => false);
  await restoreBuyDraft().catch(() => false);
  render();
  try {
    const sc = JSON.parse(sessionStorage.getItem(SCROLL_KEY) || 'null');
    if (sc && sc.screen === S.screen) requestAnimationFrame(() => window.scrollTo(0, sc.y || 0));
  } catch { /* sans effet */ }
  checkUpdate(false);
  try {
    const data = await api('/api/providers', null, { withKey: false, timeout: 15000 });
    if (Array.isArray(data.providers) && data.providers.length) {
      S.providers = data.providers;
      if (!S.providers.some((p) => p.id === S.settings.provider)) {
        S.settings.provider = data.defaultProvider || S.providers[0].id; saveSettings();
      }
      if (!S.editing) render();
    }
  } catch { /* hors ligne : catalogue de secours */ }
})();
</script>
